<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Stepwise — an interactive English course that takes you from zero to A1: lessons, speaking, listening, reading, writing, grammar and vocabulary." />
    <meta name="theme-color" content="#6d5dfc" />
    <title>Stepwise — Learn English step by step</title>
    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      ;(function () {
        try {
          var raw = localStorage.getItem('stepwise-progress-v1')
          var theme = raw ? JSON.parse(raw).state.settings.theme : 'system'
          var host = document.documentElement.getAttribute('data-theme')
          var dark = theme === 'dark' || (theme !== 'light' && (host ? host === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches))
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
